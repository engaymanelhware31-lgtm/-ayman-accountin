<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7fa;
color:#17212b;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}

.sidebar{
position:fixed;
right:0;
top:0;
bottom:0;
width:245px;
background:#15212d;

.brand{

.main{

.panel,

.muted,

.title{

.cards{

.btn.danger{

.form{

.field label{

margin-bottom:6px;

.field input,
.field select{

padding:11px;
border:1px solid #d7dee5;

.table-wrap{
overflow:auto
}

table{
width:100%;

}

th,
td{
text-align:right;
padding:10px 8px;
border-bottom:1px solid #edf0f2;
white-space:nowrap
}

th{

color:#66737f
}

.empty{

padding:25px;
color:#7b8792
}

.suggest{

}

.suggestions{

left:0;
right:0;

overflow:auto
}

.suggestions div{
padding:10px;
cursor:pointer;
border-bottom:1px solid #eee
}

.suggestions div:hover{
background:#eef7ff
}

.project-box{
background:#f8fbff;
border:1px solid #dfeaf4;

padding:14px;
margin-top:14px;

}

.totals{

gap:12px;
flex-wrap:wrap;
margin-top:16px
}

.mini{

border:1px solid #e5e9ed;
border-radius:10px;
padding:12px 16px;
min-width:160px
}

.mini b{
display:block;
font-size:18px;
margin-top:4px
}

.installment{

grid-template-columns:1fr 1fr 1fr 1fr auto;
gap:8px;

@media(max-width:850px){

.sidebar{

padding:14px 7px
}

.brand{
font-size:0;
text-align:center
}

.brand small{
display:none
}

.sidebar a{
font-size:0;
text-align:center
}

.sidebar a:first-letter{

.main{

padding:14px

.cards,
.grid,
.form,
.form.three{

.installment{

}

@media print{

body{
background:#fff
}

.sidebar,
.topbar,
.no-print{

.main{
margin:0;
padding:0
}

.panel,
.card{

border:1px solid #ddd

}
</style>
</head>

<body>

<aside class="sidebar">

<div class="brand">
Ayman <span>Accounting</span>
<small>نظام محاسبي</small>
</div>

<nav>

<a href="#dashboard" data-r="dashboard">
🏠 الرئيسية
</a>

<main class="main">

<header class="topbar">

<div>

<b>Ayman Accounting</b>

<div class="muted">
الإصدار 1.4 — نسخة اختبار
</div>

</div>

<b>د.ك</b>

</header>

<div id="app"></div>

</main>


<script>

const KEY="ayman_accounting_v14";

const oldKeys=[
"aymanAccounting_v13",
"aymanAccounting_v12"
];


function fresh(){

return{

customers:[],
suppliers:[],
receipts:[],
payments:[],
ops:[],
receiptSeq:{},
paymentSeq:{}

}

}


function load(){

for(
const k of [KEY,...oldKeys]
){

const s=localStorage.getItem(k);

if(s){

try{

const d=JSON.parse(s);

const x={
...fresh(),
...d
};

x.receipts=x.receipts||[];
x.payments=x.payments||[];
x.receiptSeq=x.receiptSeq||{};
x.paymentSeq=x.paymentSeq||{};

x.customers=
(x.customers||[])
.map(c=>({

...c,

projectAddress:
c.projectAddress||
c.address||
"",

projectValue:
Number(c.projectValue||0),

installments:
c.installments||[]

}));

return x

}catch(e){}

}

}

return fresh()

}


let db=load();


function save(){

localStorage.setItem(
KEY,
JSON.stringify(db)
);

render()

}


function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
)

}


function money(v){

return Number(v||0)
.toLocaleString(
"ar-KW",
{
minimumFractionDigits:3,
maximumFractionDigits:3
}
)+" د.ك"

}


function today(){

return new Date()
.toISOString()
.slice(0,10)

}


function year(){

return new Date()
.getFullYear()

}


function route(){

return location.hash.slice(1)||"dashboard"

}


function projectValue(){

return db.customers.reduce(
(a,c)=>
a+Number(c.projectValue||0),
0
)

}


function customerPaid(name){

return db.receipts
.filter(
r=>r.customer===name
)
.reduce(
(a,r)=>
a+Number(r.amount||0),
0
)

}


function paidTotal(){

return db.receipts.reduce(
(a,r)=>
a+Number(r.amount||0),
0
)

}


function remainingTotal(){

return projectValue()-paidTotal()

}


function nextNo(type,y=year()){

const key=String(y);

const seq=
type==="receipt"
?
db.receiptSeq
:
db.paymentSeq;

seq[key]=
Number(seq[key]||0)+1;

return seq[key]

}


function shell(title,html){

return`

<section>

<h1 class="title">
${title}
</h1>

${html}

</section>

`

}


function dashboard(){

const due=
db.customers
.flatMap(
c=>
(c.installments||[])
.filter(i=>!i.paid)
.map(i=>({

...i,

customer:c.name,

project:
c.projectAddress||""

}))

);

return shell(
"لوحة التحكم",

`

<div class="cards">

<div class="card">

<div class="label">
إجمالي مبلغ المشاريع
</div>

<div class="value">
${money(projectValue())}
</div>

</div>


<div class="card">

<div class="label">
إجمالي المدفوع
</div>

<div class="value">
${money(paidTotal())}
</div>

</div>


<div class="card">

<div class="label">
إجمالي المتبقي
</div>

<div class="value">
${money(remainingTotal())}
</div>

</div>

</div>


<div
class="cards"
style="margin-top:14px"
>

<div class="card">

<div class="label">
عدد العملاء / المشاريع
</div>

<div class="value">
${db.customers.length}
</div>

</div>


<div class="card">

<div class="label">
سندات القبض
</div>

<div class="value">
${db.receipts.length}
</div>

</div>


<div class="card">

<div class="label">
سندات الصرف
</div>

<div class="value">
${db.payments.length}
</div>

</div>

</div>


<div class="grid">

<div class="panel">

<h3>
آخر سندات القبض
</h3>

${receiptTable(
db.receipts
.slice()
.reverse()
.slice(0,8)
)}

</div>


<div class="panel">

<h3>
الدفعات غير المصروفة
</h3>

${installmentTable(
due.slice(0,8)
)}

</div>

</div>

`

)

}


function customers(){

return shell(
"العملاء والمشروعات",

`

<div class="panel">

<div class="form three">

<div class="field">

<label>
اسم العميل
</label>

<input id="cname">

</div>


<div class="field">

<label>
عنوان المشروع
</label>

<input id="caddress">

</div>


<div class="field">

<label>
قيمة المشروع
</label>

<input
id="cvalue"
type="number"
min="0"
step="0.001"
>

</div>

</div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
onclick="addCustomer()"
>

إضافة العميل والمشروع

</button>

</div>

</div>


<div
class="panel"
style="margin-top:16px"
>

${customerTable()}

</div>

`

)

}


function customerTable(){

if(!db.customers.length)

return`

<div class="empty">
لا توجد عملاء مسجلون
</div>

`;

return`

<div class="table-wrap">

<table>

<thead>

<tr>

<th>اسم العميل</th>
<th>عنوان المشروع</th>
<th>قيمة المشروع</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>الدفعات</th>
<th>إجراء</th>

</tr>

</thead>

<tbody>

${

db.customers
.map(
(c,i)=>{

const paid=
customerPaid(c.name);

const rem=
Number(c.projectValue||0)-paid;

return`

<tr>

<td>
${esc(c.name)}
</td>

<td>
${esc(c.projectAddress)}
</td>

<td>
${money(c.projectValue)}
</td>

<td>
${money(paid)}
</td>

<td>
${money(rem)}
</td>

<td>
${(c.installments||[]).length}
</td>

<td>

<button
class="btn secondary"
onclick="openCustomer(${i})"
>

إدارة الدفعات

</button>

</td>

</tr>

`

}
)
.join("")

}

</tbody>

</table>

</div>

`

}


function addCustomer(){

const name=
document
.getElementById("cname")
.value
.trim();

const address=
document
.getElementById("caddress")
.value
.trim();

const value=
Number(
document
.getElementById("cvalue")
.value||0
);

if(
!name||
!address||
value<=0
)

return alert(
"أدخل اسم العميل وعنوان المشروع وقيمة المشروع"
);

if(
db.customers.some(
c=>c.name===name
)
)

return alert(
"العميل مسجل بالفعل"
);

db.customers.push({

name,

projectAddress:address,

projectValue:value,

installments:[]

});

save();

alert(
"تمت إضافة العميل والمشروع"
)

}


function openCustomer(i){

const c=db.customers[i];

document.getElementById("app")
.innerHTML=

shell(
"دفعات المشروع",

`

<div class="panel">

<div class="project-box">

<b>
العميل:
</b>

${esc(c.name)}

<br>

<b>
المشروع:
</b>

${esc(c.projectAddress)}

<br>

<b>
قيمة المشروع:
</b>

${money(c.projectValue)}

<br>

<b>
المدفوع بسندات القبض:
</b>

${money(customerPaid(c.name))}

<br>

<b>
المتبقي:
</b>

${money(
Number(c.projectValue||0)
-
customerPaid(c.name)
)}

</div>


<h3>
جدول الدفعات
</h3>


<div id="inst">

${instRows(c.installments)}

</div>


<div class="actions no-print">

<button
class="btn secondary"
onclick="addInst()"
>

+ إضافة دفعة

</button>


<button
class="btn"
onclick="saveInst(${i})"
>

حفظ الدفعات

</button>


<button
class="btn secondary"
onclick="location.hash='customers'"
>

رجوع

</button>

</div>

</div>

`

)

}


function instRows(a){

const arr=
a.length
?
a
:
[
{
amount:"",
date:"",
paid:false,
note:""
}
];

return arr
.map(
i=>`

<div class="installment">

<div class="field">

<label>
قيمة الدفعة
</label>

<input
class="ia"
type="number"
step="0.001"
value="${i.amount||""}"
>

</div>


<div class="field">

<label>
ميعاد الصرف
</label>

<input
class="id"
type="date"
value="${esc(i.date||"")}"
>

</div>


<div class="field">

<label>
تم الصرف؟
</label>

<select class="ip">

<option
value="false"
${!i.paid?"selected":""}
>

لا

</option>

<option
value="true"
${i.paid?"selected":""}
>

نعم

</option>

</select>

</div>


<div class="field">

<label>
ملاحظات
</label>

<input
class="in"
value="${esc(i.note||"")}"
>

</div>


<button
class="btn danger no-print"
onclick="this.parentElement.remove()"
>

حذف

</button>

</div>

`
)
.join("")

}


function addInst(){

document
.getElementById("inst")
.insertAdjacentHTML(
"beforeend",
instRows(
[
{
amount:"",
date:"",
paid:false,
note:""
}
]
)
)

}


function saveInst(i){

db.customers[i].installments=

[
...document
.querySelectorAll(
"#inst .installment"
)
]
.map(
r=>({

amount:Number(
r.querySelector(".ia")
.value||0
),

date:
r.querySelector(".id")
.value,

paid:
r.querySelector(".ip")
.value==="true",

note:
r.querySelector(".in")
.value

})
)
.filter(
x=>x.amount||x.date
);

save();

openCustomer(i);

alert(
"تم حفظ جدول الدفعات"
)

}


function receipts(){

return shell(
"سند قبض",

`

<div class="panel">

<div class="form">

<div class="field suggest">

<label>
اسم العميل
</label>

<input
id="rCustomer"
autocomplete="off"
placeholder="اكتب اسم العميل"
>

<div
id="rs"
class="suggestions"
style="display:none"
></div>

</div>


<div class="field">

<label>
قيمة سند القبض
</label>

<input
id="rAmount"
type="number"
min="0"
step="0.001"
>

</div>


<div class="field">

<label>
التاريخ
</label>

<input
id="rDate"
type="date"
value="${today()}"
>

</div>

</div>


<div
id="rInfo"
class="project-box"
style="display:none"
></div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
onclick="saveReceipt()"
>

حفظ سند القبض

</button>


<button
class="btn secondary"
onclick="location.hash='dashboard'"
>

إلغاء

</button>

</div>

</div>


<div
class="panel"
style="margin-top:16px"
>

<h3>
آخر سندات القبض
</h3>

${receiptTable(
db.receipts
.slice()
.reverse()
.slice(0,20)
)}

</div>

`

)

}


function bindReceipt(){

const input=
document.getElementById(
"rCustomer"
);

const box=
document.getElementById("rs");

if(!input)
return;


function show(){

const q=
input.value
.trim()
.toLowerCase();

const arr=
db.customers.filter(
c=>
!q||
c.name
.toLowerCase()
.includes(q)
);

box.innerHTML=

arr.length

?

arr.map(
(c,i)=>`

<div
onclick="chooseCustomer(${i})"
>

<b>
${esc(c.name)}
</b>

<div class="muted">

${esc(c.projectAddress)}

—

${money(c.projectValue)}

—

المتبقي

${money(
Number(c.projectValue||0)
-
customerPaid(c.name)
)}

</div>

</div>

`
)
.join("")

:

"<div>لا يوجد عميل</div>";

box.style.display="block"

}

input.oninput=show;
input.onfocus=show;

document.addEventListener(
"click",
e=>{

if(
!e.target.closest(".suggest")
)

box.style.display="none"

},
{once:true}
)

}


function chooseCustomer(i){

const c=db.customers[i];

document
.getElementById("rCustomer")
.value=c.name;

document
.getElementById("rs")
.style.display="none";

const paid=
customerPaid(c.name);

const rem=
Number(c.projectValue||0)-paid;

document
.getElementById("rInfo")
.style.display="block";

document
.getElementById("rInfo")
.innerHTML=

`

<b>
اسم العميل:
</b>

${esc(c.name)}

<br>

<b>
اسم المشروع:
</b>

${esc(c.projectAddress)}

<br>

<b>
قيمة المشروع:
</b>

${money(c.projectValue)}

<br>

<b>
المدفوع:
</b>

${money(paid)}

<br>

<b>
المتبقي:
</b>

${money(rem)}

`

}


function saveReceipt(){

const name=
document
.getElementById("rCustomer")
.value
.trim();

const amount=
Number(
document
.getElementById("rAmount")
.value||0
);

const date=
document
.getElementById("rDate")
.value||today();

const c=
db.customers.find(
x=>x.name===name
);

if(!c)

return alert(
"اختر عميلًا مسجلًا"
);

const rem=
Number(c.projectValue||0)
-
customerPaid(name);

if(amount<=0)

return alert(
"أدخل قيمة سند القبض"
);

if(amount>rem)

return alert(
"قيمة سند القبض أكبر من المبلغ المتبقي"
);

const y=
new Date(
date+"T00:00:00"
)
.getFullYear();

const no=
nextNo(
"receipt",
y
);

const r={

id:Date.now(),

no,

year:y,

customer:name,

project:c.projectAddress,

projectValue:
Number(c.projectValue),

amount,

date

};

db.receipts.push(r);

db.ops.unshift({

type:"receipt",

no,

year:y,

party:name,

amount,

date,

label:"سند قبض"

});

save();

alert(
"تم حفظ سند القبض رقم "+no
);

printReceipt(r)

}


function payments(){

return shell(
"سند صرف",

`

<div class="panel">

<div class="form">

<div class="field">

<label>
البيان / المستفيد
</label>

<input id="pParty">

</div>


<div class="field">

<label>
قيمة سند الصرف
</label>

<input
id="pAmount"
type="number"
min="0"
step="0.001"
>

</div>


<div class="field">

<label>
التاريخ
</label>

<input
id="pDate"
type="date"
value="${today()}"
>

</div>

</div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
onclick="savePayment()"
>

حفظ سند الصرف

</button>

</div>

</div>


<div
class="panel"
style="margin-top:16px"
>

${paymentTable()}

</div>

`

)

}


function savePayment(){

const party=
document
.getElementById("pParty")
.value
.trim();

const amount=
Number(
document
.getElementById("pAmount")
.value||0
);

const date=

function render(){

const r=route();

document
.querySelectorAll("[data-r]")
.forEach(
a=>
a.classList.toggle(
"active",
a.dataset.r===r
)
);

let h;

if(r==="dashboard")
h=dashboard();

else if(r==="customers")
h=customers();

else if(r==="receipts")
h=receipts();

else if(r==="payments")
h=payments();

else if(r==="journal")
h=journal();

else if(r==="reports")
h=reports();

else
h=dashboard();

document
.getElementById("app")
.innerHTML=h;

if(r==="receipts")
bindReceipt()

}


window.addEventListener(
"hashchange",
render
);

window.addEventListener(
"DOMContentLoaded",
render
);

</script>

</body>
</html>
