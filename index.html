<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayman Accounting 1.5</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
    Tahoma,
    Arial,
    sans-serif;
    background:#f4f6f8;
    color:#17212b;
}

.sidebar{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    width:250px;
    background:#15212d;
    color:white;
    padding:20px 14px;
    overflow-y:auto;
}

.logo{
    font-size:23px;
    font-weight:bold;
    padding:10px;
    margin-bottom:20px;
}

.logo small{
    display:block;
    font-size:12px;
    color:#9eabb7;
    margin-top:6px;
}

.menu a{
    display:block;
    color:#dce4ea;
    text-decoration:none;
    padding:13px;
    margin:4px 0;
    border-radius:9px;
    cursor:pointer;
}

.menu a:hover,
.menu a.active{
    background:#2a3948;
    color:#fff;
}

.main{
    margin-right:250px;
    padding:22px;
    min-height:100vh;
}

.topbar{
    background:#fff;
    border-radius:14px;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.currency{
    background:#eef7ff;
    padding:8px 13px;
    border-radius:20px;
    font-weight:bold;
}

h1{
    margin:10px 0 18px;
}

.panel{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.cards{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.card .label{
    color:#687581;
    font-size:13px;
}

.card .value{
    font-size:25px;
    font-weight:bold;
    margin-top:10px;
}

.form{
    display:grid;
    grid-template-columns:
    repeat(2,1fr);
    gap:14px;
}

.form.three{
    grid-template-columns:
    repeat(3,1fr);
}

.field label{
    display:block;
    font-size:13px;
    color:#596673;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:11px;
    border:1px solid #d7dee5;
    border-radius:8px;
    background:#fff;
    font-family:inherit;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    background:#1769aa;
    color:#fff;
    font-family:inherit;
}

.btn:hover{
    opacity:.9;
}

.btn.secondary{
    background:#e9eef3;
    color:#26333e;
}

.btn.danger{
    background:#b42318;
}

.btn.success{
    background:#218739;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:right;
    padding:11px 8px;
    border-bottom:1px solid #edf0f2;
    white-space:nowrap;
}

th{
    color:#66737f;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#7b8792;
}

.project-box{
    background:#f8fbff;
    border:1px solid #dfeaf4;
    border-radius:10px;
    padding:15px;
    line-height:2;
    margin-top:15px;
}

.suggest{
    position:relative;
}

.suggestions{
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    top:100%;
    background:#fff;
    border:1px solid #d7dee5;
    border-radius:8px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    max-height:250px;
    overflow-y:auto;
}

.suggestions div{
    padding:11px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.suggestions div:hover{
    background:#eef7ff;
}

.installment{
    display:grid;
    grid-template-columns:
    1fr 1fr 1fr 1fr auto;
    gap:8px;
    align-items:end;
    margin-bottom:10px;
}

.totals{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
}

.mini{
    background:#f7f9fb;
    border:1px solid #e5e9ed;
    border-radius:10px;
    padding:13px 16px;
    min-width:170px;
}

.mini b{
    display:block;
    font-size:18px;
    margin-top:5px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
}

.badge.yes{
    background:#e5f6e9;
    color:#18702a;
}

.badge.no{
    background:#fff0e8;
    color:#a64012;
}

.search-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search-row input{
    padding:11px;
    border:1px solid #d7dee5;
    border-radius:8px;
}

@media(max-width:900px){

    .sidebar{
        width:75px;
        padding:12px 6px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo:first-letter{
        font-size:25px;
    }

    .logo small{
        display:none;
    }

    .menu a{
        font-size:0;
        text-align:center;
    }

    .menu a:first-letter{
        font-size:20px;
    }

    .main{
        margin-right:75px;
        padding:12px;
    }

    .cards,
    .form,
    .form.three{
        grid-template-columns:1fr;
    }

    .installment{
        grid-template-columns:1fr;
    }
}

@media print{

    .sidebar,
    .topbar,
    .no-print{
        display:none !important;
    }

    .main{
        margin:0;
        padding:0;
    }

    body{
        background:white;
    }

    .panel{
        box-shadow:none;
        border:1px solid #ddd;
    }
}

</style>
</head>

<script>

/* =====================================================
   AYMAN ACCOUNTING 1.5
   ===================================================== */

const DB_KEY = "ayman_accounting_v15";


function emptyDB(){

    return {

        customers: [],

        projects: [],

        receipts: [],

        payments: [],

        journal: [],

        receiptNumbers: {},

        paymentNumbers: {},

        projectNumbers: {}

    };

}


function loadDB(){

    const saved =
        localStorage.getItem(DB_KEY);

    if(!saved){

        return emptyDB();

    }

    try{

        return {
            ...emptyDB(),
            ...JSON.parse(saved)
        };

    }catch(e){

        return emptyDB();

    }

}


let db = loadDB();


function saveDB(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}


function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(c){

        return {

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[c];

    });

}


function money(value){

    return Number(value || 0)
    .toLocaleString(
        "ar-KW",
        {
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }
    ) + " د.ك";

}


function currentYear(){

    return new Date().getFullYear();

}


function today(){

    return new Date()
    .toISOString()
    .slice(0,10);

}


function route(){

    return location.hash
    .replace("#","") ||
    "dashboard";

}


function nextNumber(type, year){

    const key = String(year);

    let target;

    if(type === "receipt"){

        target = db.receiptNumbers;

    }else if(type === "payment"){

        target = db.paymentNumbers;

    }else{

        target = db.projectNumbers;

    }

    target[key] =
        Number(target[key] || 0) + 1;

    saveDB();

    return target[key];

}


function projectTotal(){

    return db.projects.reduce(
        (sum,p)=>
        sum + Number(p.value || 0),
        0
    );

}


function customerProjects(customerId){

    return db.projects.filter(
        p=>p.customerId === customerId
    );

}


function projectPaid(projectId){

    return db.receipts
    .filter(
        r=>r.projectId === projectId
    )
    .reduce(
        (sum,r)=>
        sum + Number(r.amount || 0),
        0
    );

}


function projectRemaining(projectId){

    const p =
        db.projects.find(
            x=>x.id === projectId
        );

    if(!p) return 0;

    return Number(p.value || 0)
        - projectPaid(projectId);

}


function totalPaid(){

    return db.receipts.reduce(
        (sum,r)=>
        sum + Number(r.amount || 0),
        0
    );

}


function totalRemaining(){

    return projectTotal()
        - totalPaid();

}


/* =========================
   DASHBOARD
   ========================= */

function dashboardPage(){

    return `

    <h1>لوحة التحكم</h1>

    <div class="cards">

        <div class="card">

            <div class="label">

            </div>

            <div class="value">
                ${money(projectTotal())}
            </div>

        </div>

            </div>

            </div>

        <div class="card">

            <div class="label">
                إجمالي المتبقي

            <div class="value">
                ${money(totalRemaining())}
            </div>

        </div>

    </div>


    <div
        class="cards"
        style="margin-top:15px"
    >

        <div class="card">

                عدد العملاء
            </div>

            </div>

        </div>

            <div class="label">
                عدد المشاريع
            </div>

            </div>

        <div class="card">

            </div>

/* =========================
   CUSTOMERS
   ========================= */

function customersPage(){

    return `

    <h1>العملاء والمشروعات</h1>


    <div class="panel">

        <div class="form three">

            <div class="field">

                <label>
                    اسم العميل
                </label>

                <input
                    id="customerName"
                    placeholder="اسم العميل"
                >

            </div>


            <div class="field">

                <label>
                    عنوان المشروع
                </label>

                <input
                    id="projectAddress"
                    placeholder="عنوان المشروع"
                >

            </div>


            <div class="field">

                <label>
                    قيمة المشروع
                </label>

                <input
                    id="projectValue"
                    type="number"
                    min="0"
                    step="0.001"
                    placeholder="0.000"
                >

            </div>

        </div>


        <div class="actions no-print">

            <button
                class="btn"
                onclick="addCustomerProject()"
            >
                إضافة العميل والمشروع
            </button>

        </div>

    </div>


    <div class="panel">

        <div class="search-row no-print">

            <input
                id="customerSearch"
                placeholder="بحث باسم العميل أو المشروع"
                oninput="filterCustomers()"
            >

        </div>


        <div id="customersTable">

            ${customersTable()}

        </div>

    </div>

    `;

}


function customersTable(list=db.projects){

    if(!list.length){

        return `

        <div class="empty">
            لا توجد مشاريع مسجلة
        </div>

        `;

    }


    return `

    <div class="table-wrap">

    <table>

    <thead>

    <tr>

        <th>رقم المشروع</th>

        <th>اسم العميل</th>

        <th>عنوان المشروع</th>

        <th>قيمة المشروع</th>

        <th>المدفوع</th>

        <th>المتبقي</th>

        <th>الإجراء</th>

    </tr>

    </thead>


    <tbody>

    ${list.map(p=>{

        const c =
            db.customers.find(
                x=>x.id===p.customerId
            );

        const paid =
            projectPaid(p.id);

        const remaining =
            Number(p.value)-paid;


        return `

        <tr>

            <td>
                ${esc(p.number)}/${p.year}
            </td>

            <td>
                ${esc(c?.name || "")}
            </td>

            <td>
                ${esc(p.address)}
            </td>

            <td>
                ${money(p.value)}
            </td>

            <td>
                ${money(paid)}
            </td>

            <td>
                ${money(remaining)}
            </td>

            <td>

                <button
                    class="btn secondary"
                    onclick="openProject('${p.id}')"
                >
                    المشروع
                </button>

            </td>

        </tr>

        `;

    }).join("")}

    </tbody>

    </table>

    </div>

    `;

}


function addCustomerProject(){

    const name =
        document
        .getElementById("customerName")
        .value.trim();

    const address =
        document
        .getElementById("projectAddress")
        .value.trim();

    const value =
        Number(
            document
            .getElementById("projectValue")
            .value || 0
        );


    if(!name){

        alert("أدخل اسم العميل");

        return;

    }


    if(!address){

        alert("أدخل عنوان المشروع");

        return;

    }


    if(value <= 0){

        alert("أدخل قيمة المشروع");

        return;

    }


    let customer =
        db.customers.find(
            c=>c.name===name
        );


    if(!customer){

        customer = {

            id:
                "C"+Date.now(),

            name

        };

        db.customers.push(customer);

    }


    const y =
        currentYear();

    const number =
        nextNumber(
            "project",
            y
        );


    db.projects.push({

        id:
            "P"+Date.now(),

        customerId:
            customer.id,

        number,

        year:y,

        address,

        value,

        installments:[]

    });


    saveDB();

    alert(
        "تمت إضافة المشروع رقم "
        +number
        +"/"
        +y
    );

    render();

}


function filterCustomers(){

    const q =
        document
        .getElementById("customerSearch")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        db.projects.filter(p=>{

            const c =
                db.customers.find(
                    x=>x.id===p.customerId
                );

            return (

                String(
                    c?.name || ""
                )
                .toLowerCase()
                .includes(q)

                ||

                String(
                    p.address || ""
                )
                .toLowerCase()
                .includes(q)

            );

        });


    document
    .getElementById("customersTable")
    .innerHTML =
        customersTable(filtered);

}


/* =========================
   PROJECT
   ========================= */

function openProject(id){

    const p =
        db.projects.find(
            x=>x.id===id
        );

    if(!p) return;


    const c =
        db.customers.find(
            x=>x.id===p.customerId
        );


    const paid =
        projectPaid(p.id);

    const remaining =
        Number(p.value)-paid;


    document
    .getElementById("app")
    .innerHTML = `

    <h1>
        المشروع ${esc(p.number)}/${p.year}
    </h1>


    <div class="panel">

        <div class="project-box">

            <b>العميل:</b>
            ${esc(c?.name || "")}

            <br>

            <b>عنوان المشروع:</b>
            ${esc(p.address)}

            <br>

            <b>قيمة المشروع:</b>
            ${money(p.value)}

            <br>

            <b>المدفوع:</b>
            ${money(paid)}

            <br>

            <b>المتبقي:</b>
            ${money(remaining)}

        </div>


        <h3>
            جدول الدفعات
        </h3>


        <div id="installments">

            ${installmentRows(
                p.installments || []
            )}

        </div>


        <div class="actions no-print">

            <button
                class="btn secondary"
                onclick="addInstallmentRow()"
            >
                + إضافة دفعة
            </button>


            <button
                class="btn"
                onclick="saveInstallments('${p.id}')"
            >
                حفظ الدفعات
            </button>


            <button
                class="btn secondary"
                onclick="location.hash='customers'"
            >
                رجوع
            </button>

        </div>

    </div>

    `;

}


function installmentRows(arr){

    if(!arr.length){

        arr=[{

            amount:"",
            date:"",
            paid:false,
            note:""

        }];

    }


    return arr.map(i=>`

    <div class="installment">

        <div class="field">

            <label>
                قيمة الدفعة
            </label>

            <input
                class="ia"
                type="number"
                min="0"
                step="0.001"
                value="${i.amount || ""}"
            >

        </div>


        <div class="field">

            <label>
                ميعاد الصرف
            </label>

            <input
                class="id"
                type="date"
                value="${esc(i.date || "")}"
            >

        </div>


        <div class="field">

            <label>
                تم الصرف؟
            </label>

            <select class="ip">

                <option
                    value="false"
                    ${!i.paid?"selected":""}
                >
                    لا
                </option>

                <option
                    value="true"
                    ${i.paid?"selected":""}
                >
                    نعم
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                ملاحظات
            </label>

            <input
                class="in"
                value="${esc(i.note || "")}"
            >

        </div>


        <button
            class="btn danger no-print"
            onclick="this.parentElement.remove()"
        >
            حذف
        </button>

    </div>

    `).join("");

}


function addInstallmentRow(){

    document
    .getElementById("installments")
    .insertAdjacentHTML(
        "beforeend",
        installmentRows([
            {
                amount:"",
                date:"",
                paid:false,
                note:""
            }
        ])
    );

}


function saveInstallments(projectId){

    const p =
        db.projects.find(
            x=>x.id===projectId
        );

    if(!p) return;


    const rows =
        [
            ...document
            .querySelectorAll(
                "#installments .installment"
            )
        ];


    p.installments =
        rows.map(row=>({

            amount:
                Number(
                    row
                    .querySelector(".ia")
                    .value || 0
                ),

            date:
                row
                .querySelector(".id")
                .value,

            paid:
                row
                .querySelector(".ip")
                .value==="true",

            note:
                row
                .querySelector(".in")
                .value.trim()

        }))
        .filter(
            x=>x.amount>0 || x.date
        );


    saveDB();

    alert(
        "تم حفظ جدول الدفعات"
    );

    openProject(projectId);

}
  <script>

/* =========================
   سند القبض
   ========================= */

function receiptsPage(){

    return `

    <h1>سند قبض</h1>

    <div class="panel">

        <div class="form">

            <div class="field suggest">

                <label>
                    اسم العميل
                </label>

                <input
                    id="receiptCustomer"
                    autocomplete="off"
                    placeholder="اكتب اسم العميل"
                >

                <div
                    id="receiptSuggestions"
                    class="suggestions"
                    style="display:none"
                ></div>

            </div>


            <div class="field">

                <label>
                    المشروع
                </label>

                <select id="receiptProject">

                    <option value="">
                        اختر العميل أولاً
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    قيمة سند القبض
                </label>

                <input
                    id="receiptAmount"
                    type="number"
                    min="0"
                    step="0.001"
                    placeholder="0.000"
                >

            </div>


            <div class="field">

                <label>
                    التاريخ
                </label>

                <input
                    id="receiptDate"
                    type="date"
                    value="${today()}"
                >

            </div>

        </div>


        <div
            id="receiptInfo"
            class="project-box"
            style="display:none"
        ></div>


        <div class="actions no-print">

            <button
                class="btn"

/* =========================

   ========================= */

function bindReceiptCustomer(){

    const input =
        document.getElementById(
            "receiptCustomer"
        );

    const box =
        document.getElementById(
            "receiptSuggestions"
        );

    if(!input || !box) return;


    function showSuggestions(){

        const q =
            input.value
            .trim()
            .toLowerCase();


        const customers =
            db.customers.filter(
                c =>
                    !q ||
                    c.name
                    .toLowerCase()
                    .includes(q)
            );


        box.innerHTML =
            customers.length

            ?

            customers.map(
                c=>`

                <div
                    onclick="
                        selectReceiptCustomer('${c.id}')
                    "
                >

                    <b>
                        ${esc(c.name)}
                    </b>

                    <div class="muted">

                        ${projectCount(c.id)}
                        مشروع

                    </div>

                </div>

                `
            ).join("")

            :

            `
            <div>
                لا يوجد عميل بهذا الاسم
            </div>
            `;


        box.style.display =
            "block";

    }


    input.addEventListener(
        "input",
        showSuggestions
    );


    input.addEventListener(
        "focus",
        showSuggestions
    );

}


function projectCount(customerId){

    return db.projects.filter(
        p=>p.customerId===customerId
    ).length;

}


/* =========================
   اختيار العميل
   ========================= */

function selectReceiptCustomer(customerId){

    const c =
        db.customers.find(
            x=>x.id===customerId
        );

    if(!c) return;


    document
    .getElementById(
        "receiptCustomer"
    )
    .value =
        c.name;


    document
    .getElementById(
        "receiptSuggestions"
    )
    .style.display =
        "none";


    const select =
        document.getElementById(
            "receiptProject"
        );


    const projects =
        customerProjects(customerId);


    select.innerHTML =

        `<option value="">
            اختر المشروع
        </option>`

        +

        projects.map(
            p=>`

            <option value="${p.id}">

                ${esc(p.number)}/${p.year}
                -
                ${esc(p.address)}

            </option>

            `
        ).join("");


    select.onchange =
        updateReceiptProject;

}


/* =========================
   بيانات المشروع
   ========================= */

function updateReceiptProject(){

    const id =
        document
        .getElementById(
            "receiptProject"
        )
        .value;


    const info =
        document
        .getElementById(
            "receiptInfo"
        );


    const p =
        db.projects.find(
            x=>x.id===id
        );


    if(!p){

        info.style.display =
            "none";

        return;

    }


    const c =
        db.customers.find(
            x=>x.id===p.customerId
        );


    const paid =
        projectPaid(p.id);


    const remaining =
        Number(p.value || 0)
        -
        paid;


    info.style.display =

    info.innerHTML = `

        <br>

/* =========================
   حفظ سند القبض
   ========================= */

function saveReceipt(){

    const customerName =
        document
        .getElementById(
            "receiptCustomer"
        )
        .value
        .trim();


    const projectId =
        document
        .getElementById(
            "receiptProject"
        )
        .value;


    const amount =
        Number(
            document
            .getElementById(
                "receiptAmount"
            )
            .value || 0
        );


    const date =
        document
        .getElementById(
            "receiptDate"
        )
        .value ||
        today();


    const customer =
        db.customers.find(
            c=>c.name===customerName
        );


    if(!customer){

        alert(
            "اختر عميلًا مسجلًا"
        );

        return;

    }


    const project =
        db.projects.find(
            p=>p.id===projectId
        );


    if(!project){

        alert(
            "اختر المشروع"
        );

        return;

    }


    const remaining =
        projectRemaining(
            project.id
        );


    if(amount<=0){

        alert(
            "أدخل قيمة سند القبض"
        );

        return;

    }


    if(amount>remaining){

        alert(
            "لا يمكن أن يتجاوز سند القبض المبلغ المتبقي"
        );

        return;

    }


    const y =
        new Date(
            date+"T00:00:00"
        )
        .getFullYear();


    const number =
        nextNumber(
            "receipt",
            y
        );


    const receipt = {

        id:
            "R"+Date.now(),

        number,

        year:y,

        customerId:
            customer.id,

        projectId:
            project.id,

        customer:
            customer.name,

        project:
            project.address,

        projectValue:
            Number(project.value),

        amount,

        date

    };


    db.receipts.push(
        receipt
    );


    /* القيد اليومي */

    db.journal.push({

        id:
            "J"+Date.now(),

        date,

        number,

        type:
            "سند قبض",

        description:
            "قبض من العميل " +
            customer.name,

        customerId:
            customer.id,

        projectId:
            project.id,

        debit:
            amount,

        credit:
            amount

    });


    saveDB();


    alert(
        "تم حفظ سند القبض رقم "
        +
        number
        +
        "/"
        +
        y
    );


    printReceipt(
        receipt
    );

}

function searchJournal(){

    const from =
        document
        .getElementById("journalFrom")
        .value;


    const to =

        .getElementById("journalTo")
        .value;


    let list =
        db.journal;


    if(from){

        list =
            list.filter(
                x=>x.date >= from

    if(to){

        list =
            list.filter(
                x=>x.date <= to
            );

    }


    document
    .getElementById("journalResult")
    .innerHTML =
        journalTable(list);

    if(to){

function printReport(type){

    let title="";
    let html="";


    if(type==="projects"){

        title="تقرير المشاريع";

        html=
            customersTable();

    }


    else if(type==="receipts"){

        title="تقرير سندات القبض";

        html=
            receiptTable(
                db.receipts
                .slice()
                .reverse()
            );

    }


    else if(type==="payments"){

        title="تقرير سندات الصرف";

        html=
            paymentTable(
                db.payments
                .slice()
                .reverse()
            );

    }


    else if(type==="journal"){

        title="تقرير القيود اليومية";

        html=
            journalTable(
                db.journal
            );

    }


    printHTML(
        title,
        html
    );

}


/* =====================================================
   طباعة التقرير حسب التاريخ
   ===================================================== */

function printFilteredReport(type){

    const from =
        document
        .getElementById(
            "reportFrom"
        )?.value || "";


    const to =
        document
        .getElementById(
            "reportTo"
        )?.value || "";


    let list=[];


    if(type==="receipts"){

        list =
            db.receipts;

    }

    else if(type==="payments"){

        list =
            db.payments;

    }

    else if(type==="journal"){

        list =
            db.journal;

    }


    if(from){

        list =
            list.filter(
                x=>x.date>=from
            );

    }


    if(to){

        list =
            list.filter(
                x=>x.date<=to
            );

    }


    let title="";
    let html="";


    if(type==="receipts"){

        title=
            "تقرير سندات القبض";

        html=
            receiptTable(list);

    }


    else if(type==="payments"){

        title=
            "تقرير سندات الصرف";

        html=
            paymentTable(list);

    }


    else{

        title=
            "تقرير القيود اليومية";

        html=
            journalTable(list);

    }


    printHTML(
        title,
        html
    );

}

/* =========================
   CUSTOMER EDIT
========================= */

function editCustomer(id){

  const c=db.customers.find(x=>x.id===id);

  if(!c) return;

  const name=prompt(
    'اسم العميل:',
    c.name || ''
  );

  if(name===null) return;

  if(!name.trim()){
    alert('يرجى إدخال اسم العميل');
    return;
  }

  c.name=name.trim();

  saveDB();
  render();
}


/* =========================
   DELETE CUSTOMER
========================= */

function deleteCustomer(id){

  const c=db.customers.find(x=>x.id===id);

  if(!c) return;

  const projects=db.projects.filter(
    p=>p.customerId===id
  );

  if(projects.length){

    alert(
      'لا يمكن حذف العميل حالياً لأن لديه مشاريع مسجلة.\n' +
      'قم بحذف المشاريع أولاً.'
    );

    return;
  }

  if(!confirm(
    `هل تريد حذف العميل "${c.name}"؟`
  )) return;

  db.customers=db.customers.filter(
    x=>x.id!==id
  );

  saveDB();
  render();
}


/* =========================
   EDIT PROJECT
========================= */

function editProject(id){

  const p=db.projects.find(x=>x.id===id);

  if(!p) return;

  const name=prompt(
    'اسم المشروع / وصف المشروع:',
    p.name || ''
  );

  if(name===null) return;

  const address=prompt(
    'عنوان المشروع:',
    p.address || ''
  );

  if(address===null) return;

  const value=prompt(
    'قيمة المشروع بالدينار الكويتي:',
    p.value || 0
  );

  if(value===null) return;

  const numericValue=Number(value);

  if(!Number.isFinite(numericValue) || numericValue<0){

    alert('قيمة المشروع غير صحيحة');
    return;
  }

  p.name=name.trim();
  p.address=address.trim();
  p.value=numericValue;

  saveDB();
  render();
}


/* =========================
   DELETE PROJECT
========================= */

function deleteProject(id){

  const p=db.projects.find(x=>x.id===id);

  if(!p) return;

  const paid=projectPaid(id);

  if(paid>0){

    alert(
      'لا يمكن حذف المشروع لأن عليه سندات قبض مسجلة.'
    );

    return;
  }

  if(!confirm(
    `هل تريد حذف المشروع "${p.name || p.address}"؟`
  )) return;

  db.projects=db.projects.filter(
    x=>x.id!==id
  );

  saveDB();
  render();
}

/* =========================

function inDateRange(date,from,to){

  if(!date) return true;

  if(from && date<from) return false;

  if(to && date>to) return false;

  return true;
}


function filteredReceipts(from,to){

  return db.receipts.filter(
    r=>inDateRange(r.date,from,to)
  );

}


function filteredPayments(from,to){

  return db.payments.filter(
    r=>inDateRange(r.date,from,to)
  );

}


function filteredJournal(from,to){

  return db.journal.filter(
    r=>inDateRange(r.date,from,to)
  );

}

  if(from) from.value='';
  if(to) to.value='';

  const container=document.getElementById('reportsContainer');

  if(container){
    container.innerHTML=allReportsHTML({});
  }
}

========================= */

function printReport(type){

  let title='';

  if(type==='projects'){

    html=projectsReportTable();

  }

  else if(type==='installments'){

    html=installmentReportTable();

  }

  else if(type==='receipts'){

    title='تقرير سندات القبض';

    html=receiptTable(db.receipts);

  }

  else if(type==='payments'){

    title='تقرير سندات الصرف';

    html=paymentTable(db.payments);

  }

  else if(type==='journal'){

    title='تقرير القيود اليومية';

    html=journalTable(db.journal);

  }

  printHTML(title,html);
}


function printFilteredReport(type){

  const from=document.getElementById('reportFrom')?.value || '';
  const to=document.getElementById('reportTo')?.value || '';

  if(type==='receipts'){

/* =========================
   PRINT ENGINE
========================= */

function printHTML(title,html,from='',to=''){

  const w=window.open(
    '',
    '_blank',
    'width=1000,height=800'
  );

  if(!w){

    alert(
      'يرجى السماح بالنوافذ المنبثقة للطباعة.'
    );

    return;
  }

  w.document.write(`

  <!DOCTYPE html>

  <html lang="ar" dir="rtl">

  <head>

    <meta charset="UTF-8">

    <title>${esc(title)}</title>

    <style>

      *{
        box-sizing:border-box;
      }

      body{
        font-family:Arial,Tahoma,sans-serif;
        direction:rtl;
        padding:30px;
        color:#111;
      }

      h1{
        text-align:center;
        margin-bottom:5px;
      }

      .print-date{
        text-align:center;
        margin-bottom:25px;
        color:#555;
      }

      table{
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
      }

      th,td{
        border:1px solid #333;
        padding:9px;
        text-align:right;
      }

      th{
        background:#eee;
      }

      .report-block{
        margin-bottom:35px;
      }

      @media print{

        body{
          padding:10px;
        }

        button{
          display:none;
        }

      }

    </style>

  </head>

  <body>

    <h1>${esc(title)}</h1>

    ${
      from || to
      ?
      `<div class="print-date">
        الفترة:
        ${esc(from || 'البداية')}
        -
        ${esc(to || 'حتى اليوم')}
      </div>`
      :
      `<div class="print-date">
        Ayman Accounting
      </div>`
    }

    ${html}

    <script>

      window.onload=function(){
        window.print();
      };

    <\/script>

  </body>

  </html>

  `);

  w.document.close();
}


/* =========================
   NAVIGATION
========================= */

function setActiveNav(){

  const current=location.hash || '#home';

  document
    .querySelectorAll('.nav-link')
    .forEach(el=>{

      el.classList.remove('active');

      if(
        el.getAttribute('href')===current
      ){

        el.classList.add('active');

      }

    });

}


/* =========================
   MAIN RENDER
========================= */

function render(){

  const app=document.getElementById('app');

  if(!app) return;

  const hash=
    location.hash.replace('#','') || 'home';

  setActiveNav();

  try{

    switch(hash){

      case 'customers':

        app.innerHTML=customersPage();

        break;


      case 'receipts':

        app.innerHTML=receiptsPage();

        break;


      case 'payments':

        app.innerHTML=paymentsPage();

        break;


      case 'journal':

        app.innerHTML=journalPage();

        break;


      case 'reports':

        app.innerHTML=reportsPage();

        break;


      case 'home':
      case '':

        app.innerHTML=dashboardPage();

        break;


      default:

        app.innerHTML=dashboardPage();

        break;

    }

  }

  catch(error){

    console.error(error);

    app.innerHTML=`

      <div class="card">

        <h2>حدث خطأ</h2>

        <p>
          حدث خطأ أثناء تحميل الصفحة.
        </p>

        <pre style="
          direction:ltr;
          white-space:pre-wrap;
        ">${esc(error.message || error)}</pre>

      </div>

    `;

  }

}


/* =========================
   HASH NAVIGATION
========================= */

window.addEventListener(
  'hashchange',
  render
);


/* =========================
   INITIAL LOAD
========================= */

window.addEventListener(
  'DOMContentLoaded',
  function(){

    loadDB();

    render();

  }
);


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
  'keydown',
  function(e){

    if(e.key==='Escape'){

      document
        .querySelectorAll('.modal')
        .forEach(m=>{
          m.remove();
        });

    }

  }
);


/* =========================
   FINAL SAFETY
========================= */

if(
  typeof db==='undefined'
){

  loadDB();

}

</script>

</body>
</html>
