<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ayman Accounting</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#1f2937}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#111827;color:white;padding:20px;position:fixed;right:0;top:0;bottom:0;overflow:auto}
.brand{text-align:center;font-size:22px;font-weight:bold;margin:5px 0 25px}
.nav-link{display:block;color:#d1d5db;text-decoration:none;padding:12px 14px;border-radius:10px;margin:6px 0}
.nav-link:hover,.nav-link.active{background:#374151;color:#fff}
.main{margin-right:245px;width:calc(100% - 245px);padding:25px}
h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 10px #0000000b;margin-bottom:18px}
.stat{font-size:26px;font-weight:bold;margin-top:10px}
label{display:block;font-weight:bold;margin:10px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}
textarea{min-height:80px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.btn{border:0;border-radius:9px;padding:10px 15px;background:#2563eb;color:white;margin:4px 2px}
.btn.secondary{background:#6b7280}.btn.success{background:#059669}.btn.danger{background:#dc2626}.btn.small{padding:6px 9px;font-size:13px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid #e5e7eb;padding:9px;text-align:right;white-space:nowrap}
th{background:#f3f4f6}
.empty{padding:30px;text-align:center;color:#6b7280}
.sub-row{background:#fafafa}
.info{background:#eff6ff;border:1px solid #bfdbfe;padding:14px;border-radius:10px;margin-top:12px}
.warning{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;margin-top:10px}
.report-block{background:white;padding:18px;border-radius:12px;margin:18px 0}
.report-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:800px){
 .sidebar{width:190px}.main{margin-right:190px;width:calc(100% - 190px);padding:14px}
}
@media(max-width:600px){
 .app{display:block}.sidebar{position:relative;width:100%;height:auto}.main{margin:0;width:100%}
 .nav-link{display:inline-block}.brand{margin-bottom:10px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">Ayman Accounting</div>
<a class="nav-link" href="#home">الرئيسية</a>
<a class="nav-link" href="#customers">العملاء</a>
<a class="nav-link" href="#receipts">سند قبض</a>
<a class="nav-link" href="#payments">سند صرف</a>
<a class="nav-link" href="#journal">القيود اليومية</a>
<a class="nav-link" href="#reports">التقارير</a>
</aside>
<main class="main"><div id="app"></div></main>
</div>

<script>
const KEY="ayman_accounting_v15_full";
let db={
 customers:[],projects:[],receipts:[],payments:[],journal:[],
 receiptNumbers:{},paymentNumbers:{},projectNumbers:{}
};

function loadDB(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"null");
  if(x) db=Object.assign(db,x);
 }catch(e){console.error(e)}
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function money(v){return Number(v||0).toLocaleString("ar-KW",{minimumFractionDigits:3,maximumFractionDigits:3})+" د.ك"}
function today(){return new Date().toISOString().slice(0,10)}
function year(){return new Date().getFullYear()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nextNum(obj,y){
 obj[y]=(Number(obj[y]||0)+1); saveDB(); return obj[y]
}
function projectTotal(p){return Number(p.value||0)}
function customerProjects(cid){return db.projects.filter(p=>p.customerId===cid)}
function projectPaid(pid){return db.receipts.filter(r=>r.projectId===pid).reduce((s,r)=>s+Number(r.amount||0),0)}
function projectRemaining(pid){
 const p=db.projects.find(x=>x.id===pid); if(!p)return 0;
 return Math.max(0,projectTotal(p)-projectPaid(pid))
}
function totals(){
 const total=db.projects.reduce((s,p)=>s+projectTotal(p),0);
 const paid=db.receipts.reduce((s,r)=>s+Number(r.amount||0),0);
 return {total,paid,remaining:total-paid}
}

function dashboardPage(){
 const t=totals();
 return `
 <h1>الرئيسية</h1>
 <div class="grid">
  <div class="card">إجمالي المشاريع<div class="stat">${money(t.total)}</div></div>
  <div class="card">إجمالي المقبوض<div class="stat">${money(t.paid)}</div></div>
  <div class="card">إجمالي المتبقي<div class="stat">${money(t.remaining)}</div></div>
  <div class="card">عدد العملاء<div class="stat">${db.customers.length}</div></div>
  <div class="card">عدد المشاريع<div class="stat">${db.projects.length}</div></div>
  <div class="card">سندات القبض<div class="stat">${db.receipts.length}</div></div>
  <div class="card">سندات الصرف<div class="stat">${db.payments.length}</div></div>
 </div>
 <div class="card">
  <h2>آخر سندات القبض</h2>
  ${receiptTable(db.receipts.slice(-5).reverse())}
 </div>`;
}

function customersPage(){
 return `
 <h1>العملاء والمشاريع</h1>
 <div class="card">
  <h2>إضافة عميل / مشروع</h2>
  <div class="form-grid">
   <div><label>اسم العميل</label><input id="cName"></div>
   <div><label>اسم المشروع</label><input id="pName"></div>
   <div><label>عنوان المشروع</label><input id="pAddress"></div>
   <div><label>قيمة المشروع د.ك</label><input id="pValue" type="number" min="0" step="0.001"></div>
  </div>
  <button class="btn success" onclick="addCustomerProject()">حفظ</button>
 </div>
 <div class="card">
  <label>بحث عن عميل أو مشروع أو رقم مشروع</label>
  <input id="customerSearch" oninput="filterCustomers()" placeholder="اكتب للبحث...">
  <div id="customersContainer">${customersTable()}</div>
 </div>`;
}

function addCustomerProject(){
 const name=document.getElementById("cName").value.trim();
 const pn=document.getElementById("pName").value.trim();
 const addr=document.getElementById("pAddress").value.trim();
 const val=Number(document.getElementById("pValue").value||0);
 if(!name||!pn){alert("يرجى إدخال اسم العميل واسم المشروع");return}
 if(val<0){alert("قيمة المشروع غير صحيحة");return}
 let c=db.customers.find(x=>x.name.trim()===name);
 if(!c){c={id:uid(),name};db.customers.push(c)}
 const y=year(),n=nextNum(db.projectNumbers,y);
 db.projects.push({id:uid(),customerId:c.id,name:pn,address:addr,value:val,number:`P-${y}-${String(n).padStart(3,"0")}`,year:y,installments:[]});
 saveDB(); alert("تم حفظ العميل والمشروع"); render();
}

function customersTable(list=db.customers){
 if(!list.length)return `<div class="empty">لا توجد بيانات</div>`;
 return `<div class="table-wrap"><table><thead><tr>
 <th>العميل</th><th>المشروع</th><th>رقم المشروع</th><th>القيمة</th><th>المدفوع</th><th>المتبقي</th><th>إجراءات</th>
 </tr></thead><tbody>
 ${list.flatMap(c=>customerProjects(c.id).length?customerProjects(c.id).map(p=>`
 <tr><td>${esc(c.name)}</td><td>${esc(p.name)}</td><td>${esc(p.number)}</td>
 <td>${money(p.value)}</td><td>${money(projectPaid(p.id))}</td><td>${money(projectRemaining(p.id))}</td>
 <td class="actions"><button class="btn small" onclick="editCustomer('${c.id}')">تعديل العميل</button>
 <button class="btn small" onclick="editProject('${p.id}')">تعديل المشروع</button>
 <button class="btn danger small" onclick="deleteProject('${p.id}')">حذف المشروع</button></td></tr>`):[`
 <tr><td>${esc(c.name)}</td><td colspan="5">لا توجد مشاريع</td><td><button class="btn small" onclick="editCustomer('${c.id}')">تعديل</button><button class="btn danger small" onclick="deleteCustomer('${c.id}')">حذف</button></td></tr>`]).join("")}
 </tbody></table></div>`;
}
function filterCustomers(){
 const q=(document.getElementById("customerSearch").value||"").toLowerCase();
 const list=db.customers.filter(c=>c.name.toLowerCase().includes(q)||customerProjects(c.id).some(p=>(p.name+" "+p.address+" "+p.number).toLowerCase().includes(q)));
 document.getElementById("customersContainer").innerHTML=customersTable(list);
}
function editCustomer(id){
 const c=db.customers.find(x=>x.id===id);if(!c)return;
 const n=prompt("اسم العميل",c.name);if(n===null)return;
 if(!n.trim())return alert("اسم العميل مطلوب");
 c.name=n.trim();saveDB();render();
}
function deleteCustomer(id){
 if(db.projects.some(p=>p.customerId===id))return alert("لا يمكن حذف عميل لديه مشاريع. احذف المشاريع أولاً.");
 if(!confirm("حذف العميل؟"))return;
 db.customers=db.customers.filter(x=>x.id!==id);saveDB();render();
}
function editProject(id){
 const p=db.projects.find(x=>x.id===id);if(!p)return;
 const n=prompt("اسم المشروع",p.name);if(n===null)return;
 const a=prompt("عنوان المشروع",p.address||"");if(a===null)return;
 const v=prompt("قيمة المشروع",p.value);if(v===null)return;
 if(Number(v)<0||!Number.isFinite(Number(v)))return alert("القيمة غير صحيحة");
 p.name=n.trim();p.address=a.trim();p.value=Number(v);saveDB();render();
}
function deleteProject(id){
 if(projectPaid(id)>0)return alert("لا يمكن حذف مشروع عليه سند قبض.");
 if(!confirm("حذف المشروع؟"))return;
 db.projects=db.projects.filter(p=>p.id!==id);saveDB();render();
}

function receiptsPage(){
 return `
 <h1>سند قبض</h1>
 <div class="card">
  <div class="form-grid">
   <div><label>التاريخ</label><input id="rDate" type="date" value="${today()}"></div>
   <div><label>العميل</label><input id="rCustomerSearch" list="customerList" oninput="receiptCustomerChanged()" placeholder="اكتب اسم العميل"><datalist id="customerList">${db.customers.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist></div>
   <div><label>المشروع</label><select id="rProject" onchange="updateReceiptProject()"><option value="">اختر العميل أولاً</option></select></div>
   <div><label>مبلغ سند القبض د.ك</label><input id="rAmount" type="number" min="0" step="0.001" oninput="updateReceiptProject()"></div>
  </div>
  <div id="receiptInfo"></div>
  <button class="btn success" onclick="saveReceipt()">حفظ وطباعة سند القبض</button>
 </div>
 <div class="card"><h2>سندات القبض السابقة</h2>${receiptTable(db.receipts.slice().reverse())}</div>`;
}
function receiptCustomerChanged(){
 const name=document.getElementById("rCustomerSearch").value.trim();
 const c=db.customers.find(x=>x.name===name);
 const s=document.getElementById("rProject");
 if(!c){s.innerHTML='<option value="">اختر العميل أولاً</option>';document.getElementById("receiptInfo").innerHTML="";return}
 s.innerHTML='<option value="">اختر المشروع</option>'+customerProjects(c.id).map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.number)}</option>`).join("");
 updateReceiptProject();
}
function updateReceiptProject(){
 const pid=document.getElementById("rProject").value;
 const info=document.getElementById("receiptInfo");
 const p=db.projects.find(x=>x.id===pid);
 if(!p){info.innerHTML="";return}
 const amount=Number(document.getElementById("rAmount").value||0);
 const paid=projectPaid(pid),remain=projectRemaining(pid);
 info.innerHTML=`<div class="info">
 <b>العميل:</b> ${esc(db.customers.find(c=>c.id===p.customerId)?.name)}<br>
 <b>المشروع:</b> ${esc(p.name)}<br>
 <b>قيمة المشروع:</b> ${money(p.value)}<br>
 <b>المدفوع قبل السند:</b> ${money(paid)}<br>
 <b>المتبقي:</b> ${money(remain)}<br>
 <b>بعد السند:</b> ${money(remain-amount)}
 </div>`;
}
function saveReceipt(){
 const name=document.getElementById("rCustomerSearch").value.trim();
 const c=db.customers.find(x=>x.name===name);
 const pid=document.getElementById("rProject").value;
 const amount=Number(document.getElementById("rAmount").value||0);
 const date=document.getElementById("rDate").value||today();
 if(!c||!pid)return alert("اختر العميل والمشروع");
 if(amount<=0)return alert("أدخل مبلغاً صحيحاً");
 const remain=projectRemaining(pid);
 if(amount>remain)return alert("مبلغ السند أكبر من المتبقي للمشروع");
 const y=Number(date.slice(0,4))||year(),n=nextNum(db.receiptNumbers,y);
 const r={id:uid(),number:n,year:y,date,customerId:c.id,projectId:pid,amount};
 db.receipts.push(r);saveDB();printReceipt(r);render();
}
function receiptTable(list){
 if(!list.length)return `<div class="empty">لا توجد سندات قبض</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>العميل</th><th>المشروع</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody>
 ${list.map(r=>{const c=db.customers.find(x=>x.id===r.customerId),p=db.projects.find(x=>x.id===r.projectId);return `<tr>
 <td>${r.number}/${r.year}</td><td>${esc(r.date)}</td><td>${esc(c?.name)}</td><td>${esc(p?.name)}</td><td>${money(r.amount)}</td>
 <td><button class="btn small" onclick="printReceiptById('${r.id}')">إعادة طباعة</button></td></tr>`}).join("")}
 </tbody></table></div>`;
}
function printReceiptById(id){const r=db.receipts.find(x=>x.id===id);if(r)printReceipt(r)}
function printReceipt(r){
 const c=db.customers.find(x=>x.id===r.customerId),p=db.projects.find(x=>x.id===r.projectId);
 const paidAfter=projectPaid(p.id),before=paidAfter-Number(r.amount);
 printHTML("سند قبض",`<div class="card"><h2>سند قبض رقم ${r.number}/${r.year}</h2>
 <p><b>التاريخ:</b> ${esc(r.date)}</p><p><b>العميل:</b> ${esc(c?.name)}</p><p><b>المشروع:</b> ${esc(p?.name)}</p>
 <p><b>قيمة المشروع:</b> ${money(p?.value)}</p><p><b>المدفوع قبل السند:</b> ${money(before)}</p>
 <p><b>مبلغ السند:</b> ${money(r.amount)}</p><p><b>المدفوع بعد السند:</b> ${money(paidAfter)}</p>
 <p><b>المتبقي:</b> ${money(projectRemaining(p.id))}</p><br><br>
 <table><tr><td>المستلم</td><td>العميل</td></tr><tr><td style="height:70px"></td><td></td></tr></table></div>`);
}

function paymentsPage(){
 return `
 <h1>سند صرف</h1>
 <div class="card"><div class="form-grid">
 <div><label>التاريخ</label><input id="payDate" type="date" value="${today()}"></div>
 <div><label>الجهة / المستفيد</label><input id="payTo"></div>
 <div><label>البيان</label><input id="payDesc"></div>
 <div><label>المبلغ د.ك</label><input id="payAmount" type="number" min="0" step="0.001"></div>
 </div><button class="btn success" onclick="savePayment()">حفظ وطباعة سند الصرف</button></div>
 <div class="card"><h2>سندات الصرف السابقة</h2>${paymentTable(db.payments.slice().reverse())}</div>`;
}
function savePayment(){
 const date=document.getElementById("payDate").value||today(),to=document.getElementById("payTo").value.trim(),desc=document.getElementById("payDesc").value.trim(),amount=Number(document.getElementById("payAmount").value||0);
 if(!to||amount<=0)return alert("أدخل المستفيد والمبلغ");
 const y=Number(date.slice(0,4))||year(),n=nextNum(db.paymentNumbers,y);
 const p={id:uid(),number:n,year:y,date,to,desc,amount};
 db.payments.push(p);saveDB();printPayment(p);render();
}
function paymentTable(list){
 if(!list.length)return `<div class="empty">لا توجد سندات صرف</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>المستفيد</th><th>البيان</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody>
 ${list.map(p=>`<tr><td>${p.number}/${p.year}</td><td>${esc(p.date)}</td><td>${esc(p.to)}</td><td>${esc(p.desc)}</td><td>${money(p.amount)}</td><td><button class="btn small" onclick="printPaymentById('${p.id}')">إعادة طباعة</button></td></tr>`).join("")}
 </tbody></table></div>`;
}
function printPaymentById(id){const p=db.payments.find(x=>x.id===id);if(p)printPayment(p)}
function printPayment(p){
 printHTML("سند صرف",`<div class="card"><h2>سند صرف رقم ${p.number}/${p.year}</h2>
 <p><b>التاريخ:</b> ${esc(p.date)}</p><p><b>المستفيد:</b> ${esc(p.to)}</p><p><b>البيان:</b> ${esc(p.desc)}</p>
 <p><b>المبلغ:</b> ${money(p.amount)}</p><br><br><table><tr><td>المستفيد</td><td>المعتمد</td></tr><tr><td style="height:70px"></td><td></td></tr></table></div>`);
}

function journalPage(){
 return `<h1>القيود اليومية</h1>
 <div class="card"><div class="form-grid">
 <div><label>التاريخ</label><input id="jDate" type="date" value="${today()}"></div>
 <div><label>البيان</label><input id="jDesc"></div>
 <div><label>الحساب المدين</label><input id="jDebit"></div>
 <div><label>الحساب الدائن</label><input id="jCredit"></div>
 <div><label>المبلغ</label><input id="jAmount" type="number" min="0" step="0.001"></div>
 </div><button class="btn success" onclick="addJournal()">إضافة القيد</button></div>
 <div class="card"><label>بحث</label><input id="journalSearch" oninput="searchJournal()"><div id="journalContainer">${journalTable(db.journal)}</div></div>`;
}
function addJournal(){
 const date=document.getElementById("jDate").value||today(),desc=document.getElementById("jDesc").value.trim(),debit=document.getElementById("jDebit").value.trim(),credit=document.getElementById("jCredit").value.trim(),amount=Number(document.getElementById("jAmount").value||0);
 if(!desc||!debit||!credit||amount<=0)return alert("أكمل بيانات القيد");
 db.journal.push({id:uid(),date,desc,debit,credit,amount});saveDB();render();
}
function journalTable(list){
 if(!list.length)return `<div class="empty">لا توجد قيود</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>المبلغ</th></tr></thead><tbody>
 ${list.map(j=>`<tr><td>${esc(j.date)}</td><td>${esc(j.desc)}</td><td>${esc(j.debit)}</td><td>${esc(j.credit)}</td><td>${money(j.amount)}</td></tr>`).join("")}
 </tbody><tfoot><tr><th colspan="4">الإجمالي</th><th>${money(list.reduce((s,x)=>s+Number(x.amount||0),0))}</th></tr></tfoot></table></div>`;
}
function searchJournal(){
 const q=(document.getElementById("journalSearch").value||"").toLowerCase();
 document.getElementById("journalContainer").innerHTML=journalTable(db.journal.filter(j=>(j.date+" "+j.desc+" "+j.debit+" "+j.credit).toLowerCase().includes(q)));
}

function reportsPage(){
 return `<h1>التقارير</h1>
 <div class="card"><div class="form-grid">
 <div><label>من تاريخ</label><input id="reportFrom" type="date"></div>
 <div><label>إلى تاريخ</label><input id="reportTo" type="date"></div>
 </div>
 <button class="btn" onclick="runReports()">بحث</button><button class="btn secondary" onclick="resetReports()">إلغاء الفلتر</button>
 </div>
 <div id="reportsContainer">${allReportsHTML({})}</div>`;
}
function allReportsHTML(f={}){
 const from=f.from||"",to=f.to||"";
 const rs=db.receipts.filter(x=>inRange(x.date,from,to)),ps=db.payments.filter(x=>inRange(x.date,from,to)),js=db.journal.filter(x=>inRange(x.date,from,to));
 return `
 <div class="report-block"><div class="report-head"><h2>تقرير المشاريع</h2><button class="btn" onclick="printReport('projects')">طباعة</button></div>${projectsReportTable()}</div>
 <div class="report-block"><div class="report-head"><h2>تقرير الدفعات / الأقساط</h2><button class="btn" onclick="printReport('installments')">طباعة</button></div>${installmentReportTable()}</div>
 <div class="report-block"><div class="report-head"><h2>تقرير سندات القبض</h2><button class="btn" onclick="printFilteredReport('receipts')">طباعة</button></div>${receiptTable(rs)}</div>
 <div class="report-block"><div class="report-head"><h2>تقرير سندات الصرف</h2><button class="btn" onclick="printFilteredReport('payments')">طباعة</button></div>${paymentTable(ps)}</div>
 <div class="report-block"><div class="report-head"><h2>تقرير القيود اليومية</h2><button class="btn" onclick="printFilteredReport('journal')">طباعة</button></div>${journalTable(js)}</div>`;
}
function inRange(d,f,t){return (!f||d>=f)&&(!t||d<=t)}
function projectsReportTable(){
 return `<div class="table-wrap"><table><thead><tr><th>رقم المشروع</th><th>العميل</th><th>المشروع</th><th>القيمة</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>
 ${db.projects.map(p=>{const c=db.customers.find(x=>x.id===p.customerId);return `<tr><td>${esc(p.number)}</td><td>${esc(c?.name)}</td><td>${esc(p.name)}</td><td>${money(p.value)}</td><td>${money(projectPaid(p.id))}</td><td>${money(projectRemaining(p.id))}</td></tr>`}).join("")}
 </tbody><tfoot><tr><th colspan="3">الإجمالي</th><th>${money(db.projects.reduce((s,p)=>s+Number(p.value||0),0))}</th><th>${money(db.receipts.reduce((s,r)=>s+Number(r.amount||0),0))}</th><th>${money(totals().remaining)}</th></tr></tfoot></table></div>`;
}
function installmentReportTable(){
 const rows=[];db.projects.forEach(p=>(p.installments||[]).forEach(i=>rows.push({...i,project:p.name,number:p.number,customer:db.customers.find(c=>c.id===p.customerId)?.name||""})));
 if(!rows.length)return `<div class="empty">لا توجد أقساط مجدولة</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>رقم المشروع</th><th>العميل</th><th>المشروع</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.number)}</td><td>${esc(r.customer)}</td><td>${esc(r.project)}</td><td>${esc(r.date)}</td><td>${money(r.amount)}</td><td>${esc(r.status||"معلق")}</td></tr>`).join("")}</tbody></table></div>`;
}
function runReports(){
 const f=document.getElementById("reportFrom").value,t=document.getElementById("reportTo").value;
 document.getElementById("reportsContainer").innerHTML=allReportsHTML({from:f,to:t});
}
function resetReports(){document.getElementById("reportFrom").value="";document.getElementById("reportTo").value="";document.getElementById("reportsContainer").innerHTML=allReportsHTML({})}

function printReport(type){
 let title="",html="";
 if(type==="projects"){title="تقرير المشاريع";html=projectsReportTable()}
 if(type==="installments"){title="تقرير الدفعات والأقساط";html=installmentReportTable()}
 printHTML(title,html);
}
function printFilteredReport(type){
 const f=document.getElementById("reportFrom")?.value||"",t=document.getElementById("reportTo")?.value||"";
 let title="",html="";
 if(type==="receipts"){title="تقرير سندات القبض";html=receiptTable(db.receipts.filter(x=>inRange(x.date,f,t)))}
 if(type==="payments"){title="تقرير سندات الصرف";html=paymentTable(db.payments.filter(x=>inRange(x.date,f,t)))}
 if(type==="journal"){title="تقرير القيود اليومية";html=journalTable(db.journal.filter(x=>inRange(x.date,f,t)))}
 printHTML(title,html);
}
function printHTML(title,html){
 const w=window.open("","_blank","width=1000,height=800");
 if(!w)return alert("يرجى السماح بالنوافذ المنبثقة للطباعة.");
 w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
 body{font-family:Arial,Tahoma;padding:25px}h1,h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #333;padding:8px}th{background:#eee}.card{padding:10px}
 @media print{button{display:none}}
 </style></head><body><h1>Ayman Accounting</h1><h2>${esc(title)}</h2>${html}<script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

function render(){
 const app=document.getElementById("app"),h=location.hash.replace("#","")||"home";
 document.querySelectorAll(".nav-link").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+h));
 if(h==="customers")app.innerHTML=customersPage();
 else if(h==="receipts")app.innerHTML=receiptsPage();
 else if(h==="payments")app.innerHTML=paymentsPage();
 else if(h==="journal")app.innerHTML=journalPage();
 else if(h==="reports")app.innerHTML=reportsPage();
 else app.innerHTML=dashboardPage();
}
window.addEventListener("hashchange",render);
window.addEventListener("DOMContentLoaded",()=>{loadDB();render()});
</script>
</body>
</html>
