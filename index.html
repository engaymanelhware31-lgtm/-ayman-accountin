<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayman Accounting 1.3</title>
<meta name="description" content="نظام محاسبي عربي لإدارة المشاريع والعملاء والدفعات">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7fa;
color:#17212b;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}

.layout{min-height:100vh}

.sidebar{
position:fixed;
right:0;
top:0;
bottom:0;
width:245px;
background:#15212d;
color:#fff;
padding:22px 14px
}

.brand{
font-size:22px;
font-weight:800;
padding:8px 10px 24px
}

.brand span{font-weight:400}

.brand small{
display:block;
color:#9eabb7;
font-size:12px;
margin-top:7px
}

.sidebar nav a{
display:block;
color:#dce4ea;
text-decoration:none;
padding:12px 13px;
border-radius:9px;
margin:3px 0
}

.sidebar nav a:hover,
.sidebar nav a.active{
background:#2a3948;
color:#fff
}

.main{
margin-right:245px;
padding:24px;
min-height:100vh
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff;
border-radius:14px;
padding:16px 20px;
margin-bottom:18px;
box-shadow:0 2px 10px #0000000a
}

.muted{
font-size:12px;
color:#74808c;
margin-top:4px
}

.currency{
background:#eef7ff;
padding:8px 12px;
border-radius:20px
}

.title{margin:8px 0 18px}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.card,
.panel{
background:#fff;
border-radius:14px;
padding:18px;
box-shadow:0 2px 10px #0000000a
}

.label{
font-size:13px;
color:#687581
}

.value{
font-size:24px;
font-weight:800;
margin-top:9px
}

.grid{
display:grid;
grid-template-columns:1.4fr 1fr;
gap:16px;
margin-top:16px
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:9px;
padding:11px 15px;
cursor:pointer;
background:#1769aa;
color:#fff;
text-decoration:none;
display:inline-block
}

.btn.secondary{
background:#e9eef3;
color:#26333e
}

.btn.success{background:#218739}
.btn.danger{background:#b42318}

.form{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.form.three{grid-template-columns:repeat(3,1fr)}
.form.four{grid-template-columns:repeat(4,1fr)}

.field label{
display:block;
font-size:13px;
margin-bottom:6px;
color:#596673
}

.field input,
.field select{
width:100%;
padding:11px;
border:1px solid #d7dee5;
border-radius:8px;
background:#fff
}

.field input:focus,
.field select:focus{
outline:2px solid #b8dcf4;
border-color:#1769aa
}

.table-wrap{overflow:auto}

table{
width:100%;
border-collapse:collapse
}

th,
td{
text-align:right;
padding:11px 8px;
border-bottom:1px solid #edf0f2;
white-space:nowrap
}

th{
font-size:13px;
color:#66737f
}

.empty{
padding:25px;
text-align:center;
color:#7b8792
}

.alert{
padding:12px;
border-radius:9px;
background:#fff4d6;
margin-bottom:14px
}

.suggest{position:relative}

.suggestions{
position:absolute;
z-index:20;
left:0;
right:0;
top:100%;
background:#fff;
border:1px solid #d7dee5;
border-radius:8px;
box-shadow:0 8px 25px #0002;
max-height:220px;
overflow:auto
}

.suggestions div{
padding:10px;
cursor:pointer;
border-bottom:1px solid #eee
}

.suggestions div:hover{
background:#eef7ff
}

.subtle{
font-size:12px;
color:#74808c
}

.status-yes{font-weight:700}
.status-no{font-weight:700}

.totals{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:16px
}

.totals .mini{
background:#f7f9fb;
border:1px solid #e5e9ed;
border-radius:10px;
padding:12px 16px;
min-width:160px
}

.mini b{
display:block;
font-size:18px;
margin-top:4px
}

.project-box{
background:#f8fbff;
border:1px solid #dfeaf4;
border-radius:12px;
padding:14px;
margin-top:14px
}

.installment-row{
display:grid;
grid-template-columns:1.2fr 1fr 1fr 1fr auto;
gap:8px;
align-items:end;
margin-bottom:8px
}

.print-only{display:none}

@media(max-width:850px){

.sidebar{
width:72px;
padding:14px 7px
}

.brand{
font-size:0;
text-align:center
}

.brand small{font-size:0}

.sidebar nav a{
font-size:0;
text-align:center
}

.sidebar nav a:first-letter{
font-size:20px
}

.main{
margin-right:72px;
padding:14px
}

.cards{
grid-template-columns:repeat(2,1fr)
}

.grid,
.form,
.form.three,
.form.four{
grid-template-columns:1fr
}

.topbar{padding:13px}

.value{font-size:20px}

.installment-row{
grid-template-columns:1fr
}

}

@media print{

body{background:#fff}

.sidebar,
.topbar,
.no-print{
display:none!important
}

.main{
margin:0;
padding:0
}

.print-only{
display:block
}

.panel,
.card{
box-shadow:none;
border:1px solid #ddd
}

.title{
font-size:22px
}

}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">
Ayman <span>Accounting</span>
<small>نظام محاسبي</small>
</div>

<nav id="nav">

<a href="#dashboard" data-route="dashboard">
🏠 الرئيسية
</a>

<main class="main">

<header class="topbar">

<div>
<strong>Ayman Accounting</strong>
<div class="muted">
الإصدار 1.3 — نسخة تجريبية
</div>
</div>

<span class="currency">د.ك</span>

</header>

<div id="app"></div>

</main>

</div>

<script>

const KEY="aymanAccounting_v13";
const oldKey="aymanAccounting_v12";

const defaults={
ops:[],
customers:[],
suppliers:[]
};

function load(){

let raw=localStorage.getItem(KEY);

if(raw)
return JSON.parse(raw);

let old=localStorage.getItem(oldKey);

if(old){

let d=JSON.parse(old);

d.customers=(d.customers||[]).map(c=>({
...c,
projectAddress:c.projectAddress||"",
projectValue:Number(c.projectValue||0),
installments:c.installments||[]
}));

return d
}

return structuredClone(defaults)

}

let db=load();

function save(){

localStorage.setItem(KEY,JSON.stringify(db));

render()

}

function money(v){

return Number(v||0).toLocaleString(
"ar-KW",
{
minimumFractionDigits:3,
maximumFractionDigits:3
}
)+" د.ك"

}

function route(){

return location.hash.replace("#","")||"dashboard"

}

function setActive(){

document
.querySelectorAll("#nav a")
.forEach(a=>
a.classList.toggle(
"active",
a.dataset.route===route()
)
)

}

function page(title,body){

return `
<section>
<h1 class="title">${title}</h1>
${body}
</section>
`

}

function projectTotal(){

return db.customers.reduce(
(a,c)=>a+Number(c.projectValue||0),
0
)

}

function paidTotal(){

return db.customers.reduce(
(a,c)=>
a+
(c.installments||[])
.filter(i=>i.paid)
.reduce(
(x,i)=>x+Number(i.amount||0),
0
),
0
)

}

function remainingTotal(){

return projectTotal()-paidTotal()

}

function dueInstallments(){

return db.customers
.flatMap(c=>
(c.installments||[])
.map(i=>({
...i,
customer:c.name,
project:c.projectAddress||""
}))
)
.filter(i=>!i.paid)

}

function dashboard(){

let s=sum("sale"),
p=sum("purchase"),
r=sum("receipt"),
x=sum("payment");

return page(
"لوحة التحكم",

`

<div class="cards">

<div class="card">

<div class="label">
إجمالي مبلغ المشاريع
</div>

<div class="value">
${money(projectTotal())}
</div>

</div>


<div class="card">

<div class="label">
إجمالي المدفوع
</div>

<div class="value">
${money(paidTotal())}
</div>

</div>


<div class="card">

<div class="label">
إجمالي المتبقي
</div>

<div class="value">
${money(remainingTotal())}
</div>

</div>


<div class="card">

<div class="label">
عدد المشاريع
</div>

<div class="value">
${db.customers.length}
</div>

</div>

</div>


<div
class="cards"
style="margin-top:14px"
>

<div class="card">

<div class="label">
إجمالي المبيعات
</div>

<div class="value">
${money(s)}
</div>

</div>


<div class="card">

<div class="label">
إجمالي المشتريات
</div>

<div class="value">
${money(p)}
</div>

</div>


<div class="card">

<div class="label">
المقبوضات
</div>

<div class="value">
${money(r)}
</div>

</div>


<div class="card">

<div class="label">
المدفوعات
</div>

<div class="value">
${money(x)}
</div>

</div>

</div>


<div class="grid">

<div class="panel">

<h3>
آخر العمليات
</h3>

${opsTable(db.ops.slice(0,8))}

</div>


<div class="panel">

<h3>
دفعات لم يتم صرفها
</h3>

${dueTable(dueInstallments().slice(0,6))}

</div>

</div>

`
)

}

function sum(t){

return db.ops
.filter(o=>o.type===t)
.reduce(
(a,o)=>a+Number(o.amount||0),
0
)

}

function opsTable(arr){

if(!arr.length)

return `
<div class="empty">
لا توجد عمليات بعد
</div>
`;

return `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>التاريخ</th>
<th>النوع</th>
<th>الطرف</th>
<th>المبلغ</th>

</tr>

</thead>

<tbody>

${arr.map(o=>`

<tr>

<td>${esc(o.date)}</td>

<td>${esc(o.label)}</td>

<td>${esc(o.party)}</td>

<td>${money(o.amount)}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`

}

function dueTable(arr){

if(!arr.length)

return `
<div class="empty">
لا توجد دفعات معلقة
</div>
`;

return `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>العميل</th>
<th>المشروع</th>
<th>الدفعة</th>
<th>موعد الصرف</th>
<th>الحالة</th>

</tr>

</thead>

<tbody>

${arr.map(i=>`

<tr>

<td>${esc(i.customer)}</td>

<td>${esc(i.project)}</td>

<td>${money(i.amount)}</td>

<td>${esc(i.date||"-")}</td>

<td>⏳ لم يتم</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`

}

function salesPage(){

return page(
"فاتورة مبيعات",

`

<div class="panel">

<div class="form">

<div class="field suggest">

<label>
اسم العميل
</label>

<input
id="party"
autocomplete="off"
placeholder="اكتب اسم العميل"
>

<div
id="customerSuggestions"

style="display:none"

</div>


<div class="field">

<label>
المبلغ
</label>

<input
id="amount"
type="number"

step="0.001"
placeholder="0.000"
>

</div>

</div>


<div
id="selectedProject"

style="display:none"
></div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
id="saveOp"
>
حفظ الفاتورة
</button>

<button
class="btn secondary"
onclick="location.hash='dashboard'"
>
إلغاء
</button>

</div>

</div>

`
)

}

function formPage(type,title,partyLabel){

return page(
title,

`

<div class="panel">

<div class="form">

<div class="field">

<label>
${partyLabel}
</label>

<input
id="party"
placeholder="${partyLabel}"
>

</div>


<div class="field">

<label>
المبلغ
</label>

<input
id="amount"
type="number"
min="0"
step="0.001"
placeholder="0.000"
>

</div>

</div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
id="saveOp"
>
حفظ
</button>

<button
class="btn secondary"
onclick="location.hash='dashboard'"
>
إلغاء
</button>

</div>

</div>

`
)

}

function customersPage(){

let arr=db.customers;

return page(
"العملاء والمشروعات",

`

<div class="panel">

<div class="form three">

<div class="field">

<label>
اسم العميل
</label>

<input id="pname">

</div>


<div class="field">

<label>
عنوان المشروع
</label>

<input id="projectAddress">

</div>


<div class="field">

<label>
قيمة المشروع
</label>

<input
id="projectValue"
type="number"
min="0"
step="0.001"
placeholder="0.000"
>

</div>

</div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
id="savePerson"
>
إضافة العميل والمشروع
</button>

</div>


<div style="margin-top:20px">

${
arr.length?

`

<div class="table-wrap">

<table>

<thead>

<tr>

<th>اسم العميل</th>
<th>عنوان المشروع</th>
<th>قيمة المشروع</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>عدد الدفعات</th>
<th>الإجراء</th>

</tr>

</thead>

<tbody>

${arr.map((c,idx)=>{

let paid=
(c.installments||[])
.filter(i=>i.paid)
.reduce(
(a,i)=>a+Number(i.amount||0),
0
);

return `

<tr>

<td>
${esc(c.name)}
</td>

<td>
${esc(c.projectAddress||"-")}
</td>

<td>
${money(c.projectValue)}
</td>

<td>
${money(paid)}
</td>

<td>
${money(Number(c.projectValue||0)-paid)}
</td>

<td>
${(c.installments||[]).length}
</td>

<td>

<button
class="btn secondary"
onclick="openCustomer(${idx})"
>
الدفعات
</button>

</td>

</tr>

`

}).join("")}

</tbody>

</table>

</div>

`

:

`

<div class="empty">
لا توجد بيانات
</div>

`

}

</div>

</div>

`
)

}

function openCustomer(idx){

let c=db.customers[idx];

document.getElementById("app").innerHTML=

page(
`دفعات: ${esc(c.name)}`,

`

<div class="panel">

<div class="project-box">

<b>
عنوان المشروع:
</b>

${esc(c.projectAddress||"-")}

&nbsp; | &nbsp;

<b>
قيمة المشروع:
</b>

${money(c.projectValue)}

</div>


<h3>
جدول الدفعات
</h3>


<div id="installments">

${installmentRows(c.installments||[])}

</div>


<div class="actions no-print">

<button
class="btn secondary"
onclick="addInstallmentRow()"
>
+ إضافة دفعة
</button>

<button
class="btn"
onclick="saveInstallments(${idx})"
>
حفظ الدفعات
</button>

<button
class="btn secondary"
onclick="location.hash='customers'"
>
رجوع
</button>

</div>

</div>

`
)

}

function installmentRows(arr){

let a=arr.length?
arr:
[
{
amount:"",
date:"",
paid:false
}
];

return a.map((i,n)=>`

<div
class="installment-row"
data-row="${n}"
>

<div class="field">

<label>
قيمة الدفعة
</label>

<input
class="i-amount"
type="number"
min="0"
step="0.001"
value="${Number(i.amount||0)||""}"
>

</div>


<div class="field">

<label>
ميعاد الصرف
</label>

<input
class="i-date"
type="date"
value="${esc(i.date||"")}"
>

</div>


<div class="field">

<label>
تم الصرف؟
</label>

<select class="i-paid">

<option
value="false"
${!i.paid?"selected":""}
>
لا
</option>

<option
value="true"
${i.paid?"selected":""}
>
نعم
</option>

</select>

</div>


<div class="field">

<label>
ملاحظات
</label>

<input
class="i-note"
value="${esc(i.note||"")}"
>

</div>


<button
class="btn danger no-print"
type="button"
onclick="this.parentElement.remove()"
>
حذف
</button>

</div>

`).join("")

}

function addInstallmentRow(){

document
.getElementById("installments")
.insertAdjacentHTML(
"beforeend",
installmentRows([
{
amount:"",
date:"",
paid:false,
note:""
}
])
)

}

function saveInstallments(idx){

let rows=[
...document.querySelectorAll(
"#installments .installment-row"
)
];

db.customers[idx].installments=

rows.map(r=>({

amount:Number(
r.querySelector(".i-amount").value||0
),

date:
r.querySelector(".i-date").value,

paid:
r.querySelector(".i-paid").value==="true",

note:
r.querySelector(".i-note").value.trim()

}))

.filter(i=>i.amount||i.date);

save();

alert("تم حفظ الدفعات");

openCustomer(idx)

}

function suppliers(){

let arr=db.suppliers;

return page(
"الموردون",

`

<div class="panel">

<div class="form">

<div class="field">

<label>
اسم المورد
</label>

<input id="pname">

</div>


<div class="field">

<label>
الهاتف
</label>

<input id="phone">

</div>

</div>


<div
class="actions no-print"
style="margin-top:14px"
>

<button
class="btn"
id="savePerson"
>
إضافة
</button>

</div>


<div style="margin-top:18px">

${
arr.length?

`

<div class="table-wrap">

<table>

<thead>

<tr>
<th>الاسم</th>
<th>الهاتف</th>
</tr>

</thead>

<tbody>

${arr.map(p=>`

<tr>

<td>
${esc(p.name)}
</td>

<td>
${esc(p.phone||"-")}
</td>

</tbody>

</table>

</div>

`

:

`

<div class="empty">
لا توجد بيانات
</div>

`

}

</div>

</div>

`
)

}

function reports(){

let net=
sum("sale")+
sum("receipt")-
sum("purchase")-
sum("payment");

return page(
"التقارير",

`

<div class="cards no-print">

<div class="card">

<div class="label">
تقرير المشاريع
</div>

<div
class="actions"
style="margin-top:12px"
>

<button
class="btn"
onclick="printReport('projects')"
>
🖨️ طباعة
</button>

</div>

</div>


<div class="card">

<div class="label">
تقرير الدفعات
</div>

<div
class="actions"
style="margin-top:12px"
>

<button
class="btn"
onclick="printReport('payments')"
>
🖨️ طباعة
</button>

</div>

</div>


<div class="card">

<div class="label">
تقرير المبيعات
</div>

<div
class="actions"
style="margin-top:12px"
>

<button
class="btn"
onclick="printReport('sales')"
>
🖨️ طباعة
</button>

</div>

</div>


<div class="card">

<div class="label">
تقرير المشتريات
</div>

<div
class="actions"
style="margin-top:12px"
>

<button
class="btn"
onclick="printReport('purchases')"

function bind(){

let r=route();

let b=document.getElementById("saveOp");

if(b)

b.onclick=()=>{

let party=
document.getElementById("party")
.value
.trim();

let amount=
Number(
document.getElementById("amount")
.value
);

if(!party||!amount)

return alert(
"أدخل الطرف والمبلغ"
);

let labels={

sale:"فاتورة بيع",

purchase:"فاتورة شراء",

receipt:"سند قبض",

payment:"سند صرف"

};

db.ops.unshift({

type:r,

label:labels[r],

party,

amount,

date:new Date().toLocaleString("ar-KW")

});

save();

alert(
"تم الحفظ بنجاح"
);

location.hash="dashboard"

};


let bp=document.getElementById("savePerson");

if(bp)

bp.onclick=()=>{

let name=
document.getElementById("pname")
.value
.trim();

let address=
document.getElementById("projectAddress")
?.value
.trim()||"";

let value=
Number(
document.getElementById("projectValue")
?.value||0
);

let phone=
document.getElementById("phone")
?.value
.trim()||"";

if(!name)

return alert(
"أدخل الاسم"
);

if(
r==="customers"&&
(!address||!value)
)

return alert(
"أدخل عنوان المشروع وقيمة المشروع"
);

if(r==="customers")

db.customers.push({

name,

projectAddress:address,

projectValue:value,

installments:[]

});

else

db.suppliers.push({
name,
phone
});

save()

};


let input=
document.getElementById("party");

let box=
document.getElementById(
"customerSuggestions"
);

if(
input&&
box&&
r==="sales"
){

function suggest(){

let q=
input.value
.trim()
.toLowerCase();

let arr=
db.customers.filter(
c=>
!q||
c.name
.toLowerCase()
.includes(q)
);

box.innerHTML=

arr.length?

arr.map((c,i)=>`

<div data-i="${i}">

<b>
${esc(c.name)}
</b>

<div class="subtle">

${esc(
c.projectAddress||
"بدون عنوان مشروع"
)}

—

${money(c.projectValue)}

</div>

</div>

`).join("")

:

`
<div class='subtle'>
لا يوجد عميل مسجل بهذا الاسم
</div>
`;

box.style.display="block";

box
.querySelectorAll("[data-i]")
.forEach(el=>

el.onclick=()=>{

let c=
arr[
Number(
el.dataset.i
)
];

input.value=c.name;

box.style.display="none";

document
.getElementById(
"selectedProject"
)
.style.display="block";

document
.getElementById(
"selectedProject"
)
.innerHTML=`

<b>
المشروع:
</b>

${esc(c.projectAddress||"-")}

&nbsp; | &nbsp;

<b>
قيمة المشروع:
</b>

${money(c.projectValue)}

&nbsp; | &nbsp;

<b>
المتبقي:
</b>

${money(
Number(c.projectValue||0)-
(
(c.installments||[])
.filter(i=>i.paid)
.reduce(
(a,i)=>a+Number(i.amount||0),
0
)
)
)}

`

}

)

}

input.addEventListener(
"input",
suggest
);

input.addEventListener(
"focus",
suggest
);

document.addEventListener(
"click",
e=>{
if(
!e.target.closest(".suggest")
)
box.style.display="none"
},
{once:true}
)

}

}

function journalTable(){

if(!db.ops.length)

return `

<div class="empty">
لا توجد قيود حتى الآن.
</div>

`;

return opsTable(db.ops)

}

function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
)

}

window.addEventListener(
"hashchange",
render
);

window.addEventListener(
"DOMContentLoaded",
render
);

</script>
